# Hot-reload overlay. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
name: kautilya

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      WATCHPACK_POLLING: "true"
      MAILPIT_URL: ${MAILPIT_URL:-http://host.docker.internal:54324}
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-http://host.docker.internal:54321}
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0", "-p", "3000"]
